[tool.poetry]
name = "pokegarden-api"
version = "1.0.0"
description = "PokéGarden API - AI-powered Pokémon assistant using OpenAI Agents SDK"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.5.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.0"
streamlit = "^1.40.0"
redis = "^5.2.1"

[tool.poetry.group.agent.dependencies]
openai-agents = "^0.2.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
